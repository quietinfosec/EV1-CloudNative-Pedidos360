# rabbitmq-admin-service - perfil AWS (EC2)
# Activar con SPRING_PROFILES_ACTIVE=aws al desplegar.
server.port=${SERVER_PORT:8083}

# Solo accesible desde la red interna; el Security Group restringe el acceso externo.
server.address=0.0.0.0

# Configuracion OAuth2 / Microsoft Entra ID Resource Server (opcional via env)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AZURE_JWKS_URI:https://login.microsoftonline.com/common/discovery/v2.0/keys}
pedidos360.security.issuer-uri=${AZURE_ISSUER_URI:}
pedidos360.security.audience=${AZURE_API_AUDIENCE:}

# Management API alojada en el mismo host del broker.
rabbitmq.management.base-url=${RABBITMQ_MGMT_URL:http://localhost:15672/api}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
