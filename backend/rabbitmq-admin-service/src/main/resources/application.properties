# rabbitmq-admin-service - configuracion base (comun a todos los perfiles)
spring.application.name=rabbitmq-admin-service

# Perfil activo por defecto: local (puede sobreescribirse con SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Cliente de la Management API de RabbitMQ. Las credenciales se mantienen
# server-side y se inyectan por variables de entorno (nunca en el frontend).
rabbitmq.management.base-url=${RABBITMQ_MGMT_URL:http://localhost:15672/api}
rabbitmq.management.username=${RABBITMQ_MGMT_USER:guest}
rabbitmq.management.password=${RABBITMQ_MGMT_PASSWORD:guest}

# Desarrollo local: permite abrir el panel Angular desde http://127.0.0.1:4200.
# La autorización de los endpoints sigue protegida por JWT/ROLE_ADMIN.
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
spring.web.cors.allowed-methods=GET,POST,DELETE,OPTIONS
spring.web.cors.allowed-headers=Authorization,Content-Type
spring.web.cors.allow-credentials=true
