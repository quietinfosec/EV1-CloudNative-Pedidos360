# bff-service - perfil AWS (EC2)
# Activar con SPRING_PROFILES_ACTIVE=aws al desplegar.
server.port=${SERVER_PORT:8080}

# Solo el BFF escucha externamente; el Security Group restringe el acceso.
server.address=0.0.0.0

# URLs y valores opcionales de Entra se heredan de application.properties.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
