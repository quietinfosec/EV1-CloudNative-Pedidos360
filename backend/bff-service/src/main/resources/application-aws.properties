# bff-service - perfil AWS (EC2)
# Activar con SPRING_PROFILES_ACTIVE=aws al desplegar.
server.port=${SERVER_PORT:8080}

# Solo el BFF escucha externamente; el Security Group restringe el acceso.
server.address=0.0.0.0

# Configuracion OAuth2 / Microsoft Entra ID Resource Server (opcional via env)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AZURE_JWKS_URI:https://login.microsoftonline.com/common/discovery/v2.0/keys}

# URLs y valores opcionales de Entra se heredan de application.properties.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
