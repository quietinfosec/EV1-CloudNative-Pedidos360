# bff-service - configuracion base (comun a todos los perfiles)
spring.application.name=bff-service

# Perfil activo por defecto: local (puede sobreescribirse con SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Configuracion de Microsoft Entra ID (valores via variables de entorno)
azure.tenant-id=${AZURE_TENANT_ID:}
azure.client-id=${AZURE_CLIENT_ID:}
azure.api-client-id=${AZURE_API_CLIENT_ID:}

# URLs compartidas por local y aws, con defaults para una EC2 con los tres servicios
pedidos-service.url=${PEDIDOS_SERVICE_URL:http://localhost:8081}
productos-service.url=${PRODUCTOS_SERVICE_URL:http://localhost:8082}
