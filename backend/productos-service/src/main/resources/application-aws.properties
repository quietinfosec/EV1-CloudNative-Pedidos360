# productos-service - perfil AWS (EC2)
# Activar con SPRING_PROFILES_ACTIVE=aws al desplegar.
server.port=${SERVER_PORT:8082}

# Comunicacion interna con el BFF en la misma EC2.
server.address=127.0.0.1

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Configuracion PostgreSQL / Amazon RDS mediante variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360}
spring.datasource.username=${DB_USERNAME:dbadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
