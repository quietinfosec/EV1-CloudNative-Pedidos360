# pedidos-service - configuracion base (comun a todos los perfiles)
spring.application.name=pedidos-service

# Perfil activo por defecto: local
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Los reintentos se ejecutan dentro del consumidor con RetryTemplate (3 intentos,
# backoff fijo 500 ms) para que el ACK/NACK manual controle el resultado final.
# Se desactiva el retry del listener para no duplicar politicas.
spring.rabbitmq.listener.simple.retry.enabled=false
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=3
spring.rabbitmq.listener.simple.prefetch=1

# Seguridad (EP3 - 4.5): por defecto el servicio es Resource Server (exige JWT).
# El perfil local lo desactiva de forma explicita; el perfil aws lo mantiene.
pedidos360.security.require-auth=true

# Mensajeria (EP3 - 4.4): proveedor de publicacion de eventos (rabbitmq|sqs).
messaging.provider=${MESSAGING_PROVIDER:rabbitmq}
# Parametros del adaptador SQS/ElasticMQ (solo se usan con messaging.provider=sqs).
messaging.sqs.endpoint=${SQS_ENDPOINT:http://localhost:9324}
messaging.sqs.region=${SQS_REGION:us-east-1}
messaging.sqs.access-key=${SQS_ACCESS_KEY:elasticmq}
messaging.sqs.secret-key=${SQS_SECRET_KEY:elasticmq}
messaging.sqs.queue-url=${SQS_QUEUE_URL:http://localhost:9324/000000000000/pedidos360-eventos}
