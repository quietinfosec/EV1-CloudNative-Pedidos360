# pedidos-service - perfil local
server.port=8081

# Base de datos PostgreSQL local (servicio "postgres" de docker-compose.yml)
# EP3: deja un datasource configurable en local, en paridad con el perfil aws (RDS).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360}
spring.datasource.username=${DB_USERNAME:dbadmin}
spring.datasource.password=${DB_PASSWORD:dbadmin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Seguridad: modo permisivo explicito en local (sin Microsoft Entra ID).
pedidos360.security.require-auth=false
