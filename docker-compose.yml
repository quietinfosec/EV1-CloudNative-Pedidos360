# =============================================================================
# Pedidos360 - Infraestructura local (Docker Compose)
# -----------------------------------------------------------------------------
# Incluye:
#   - Cluster RabbitMQ de 2 nodos (rabbitmq + rabbitmq2), con Management UI
#     independiente por nodo y un contenedor efimero que forma el cluster.
#   - PostgreSQL local (perfil local en paridad con Amazon RDS).
#   - Keycloak local como IDaaS de desarrollo (OIDC Authorization Code + PKCE).
#   - ElasticMQ (SQS simulado local).
#
# - No convierte los microservicios Spring Boot en contenedores.
# - BFF (:8080), Pedidos (:8081), Productos (:8082) y Admin (:8083) se siguen
#   ejecutando desde el host exactamente igual que hoy (scripts/run-local.*, mvnw).
# - Los puertos se publican solo en 127.0.0.1 (loopback) para que las consolas
#   de administracion no queden expuestas en la red local.
# - La topologia (exchange, colas, bindings, routing keys, DLQ) NO se declara
#   aqui: se declara desde Spring Boot con RabbitMQConfig, evitando duplicar
#   definiciones entre Docker y el codigo Java.
#
# Cluster:  rabbitmq  -> AMQP 5672 / UI 15672
#           rabbitmq2 -> AMQP 5673 / UI 15673
# Topologia / credenciales: docs/rabbitmq-local.md
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL local (EP3): aporta el datasource del perfil "local" en paridad
  # con Amazon RDS del perfil "aws". Misma base que consumen pedidos-service y
  # productos-service (spring.datasource.url = jdbc:postgresql://localhost:55432/pedidos360
  # con DB_PORT=55432; por defecto el host 55432 evita chocar con un PostgreSQL nativo en 5432).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pedidos360-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-pedidos360}
      POSTGRES_USER: ${DB_USERNAME:-dbadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dbadmin}

    ports:
      # 55432 -> PostgreSQL en el host, solo loopback. Se usa 55432 (no 5432)
      # para convivir con una instalacion nativa de PostgreSQL que pueda estar
      # escuchando ya en 5432. Los servicios se conectan al contenedor con
      # DB_PORT=55432 (spring.datasource.url = jdbc:postgresql://localhost:55432/pedidos360).
      - "127.0.0.1:55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - pedidos360-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dbadmin} -d ${DB_NAME:-pedidos360}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Nodo 1 del cluster RabbitMQ.
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: pedidos360-rabbitmq
    restart: unless-stopped

    # Nombre de nodo estable: sin esto RabbitMQ deriva el directorio de datos
    # del ID del contenedor, que cambia en cada recreacion y hace que la
    # topologia y los mensajes no sobrevivan a `docker compose down` + `up`,
    # pese a que el volumen rabbitmq_data este montado.
    hostname: pedidos360-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      # El vhost se declara explicitamente para que coincida siempre con
      # spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/} de los microservicios.
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_NODENAME: rabbit@pedidos360-rabbitmq
      # Cookie Erlang compartida por ambos nodos: requisito para el cluster.
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-local-cluster-cookie}

    ports:
      # 5672  -> AMQP (protocolo que usaran los microservicios)
      - "127.0.0.1:5672:5672"
      # 15672 -> RabbitMQ Management UI (solo loopback, no exponer en red)
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

    networks:
      - pedidos360-network

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Nodo 2 del cluster RabbitMQ.
  # Arranca como nodo independiente; rabbitmq2-join lo incorpora al cluster
  # del nodo 1 una vez que ambos reportan healthy.
  # ---------------------------------------------------------------------------
  rabbitmq2:
    image: rabbitmq:4.2-management
    container_name: pedidos360-rabbitmq2
    restart: unless-stopped

    hostname: pedidos360-rabbitmq2

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_NODENAME: rabbit@pedidos360-rabbitmq2
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-local-cluster-cookie}

    ports:
      # 5673  -> AMQP del nodo 2 (para pruebas de failover)
      - "127.0.0.1:5673:5672"
      # 15673 -> Management UI del nodo 2
      - "127.0.0.1:15673:15672"

    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq

    networks:
      - pedidos360-network

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Contenedor efimero: ejecuta rabbitmqctl sobre el nodo 2 para unirlo al
  # cluster del nodo 1. No arranca un broker. Es idempotente: si el nodo 2 ya
  # pertenece al cluster, termina sin cambios.
  rabbitmq2-join:
    image: rabbitmq:4.2-management
    container_name: pedidos360-rabbitmq2-join
    restart: "no"

    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-local-cluster-cookie}
      RABBITMQ_TARGET_NODE: rabbit@pedidos360-rabbitmq2
      RABBITMQ_PRIMARY_NODE: rabbit@pedidos360-rabbitmq

    entrypoint: ["/bin/bash", "/join-cluster.sh"]

    volumes:
      - ./infra/rabbitmq/join-cluster.sh:/join-cluster.sh:ro

    networks:
      - pedidos360-network

    depends_on:
      rabbitmq:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Keycloak local (IDaaS de desarrollo): emite los JWT que valida el backend
  # y permite probar el flujo de login OIDC del frontend sin un tenant cloud.
  # El realm se importa de forma idempotente al arrancar el contenedor.
  # Consola: http://localhost:8180/admin  (admin / admin)
  # Usuario demo: demo / Demo1234!  (roles USER y ADMIN)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: pedidos360-keycloak
    restart: unless-stopped

    command: ["start-dev", "--import-realm"]

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # El issuer debe coincidir con la URL que usa el navegador y el backend.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"

    ports:
      # 8180 -> consola y endpoints OIDC de Keycloak (solo loopback).
      - "127.0.0.1:8180:8080"

    volumes:
      - ./infra/keycloak/realm-pedidos360.json:/opt/keycloak/data/import/realm-pedidos360.json:ro

    networks:
      - pedidos360-network

  # ---------------------------------------------------------------------------
  # ElasticMQ (EP3 - 4.4): broker compatible con AWS SQS para verificar el
  # adaptador SqsEventPublisher en local (messaging.provider=sqs).
  # La cola "pedidos360-eventos" se declara en elasticmq.conf.
  # ---------------------------------------------------------------------------
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    container_name: pedidos360-elasticmq
    restart: unless-stopped

    ports:
      # 9324 -> endpoint SQS-compatible (solo loopback)
      - "127.0.0.1:9324:9324"

    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf

    networks:
      - pedidos360-network

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9324/?Action=ListQueues || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  pedidos360-network:
    name: pedidos360-network
    driver: bridge

volumes:
  rabbitmq_data:
    name: rabbitmq_data
  rabbitmq2_data:
    name: rabbitmq2_data
  postgres_data:
    name: postgres_data