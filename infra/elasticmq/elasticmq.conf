# ElasticMQ - broker local compatible con AWS SQS (EP3 - 4.4)
# Endpoint: http://localhost:9324
# Cuenta mock 000000000000; la queue-url resultante es
#   http://localhost:9324/000000000000/pedidos360-eventos

node-address {
  host = localhost
  port = 9324
  protocol = http
}

rest-stats {
  enabled = true
  bind-port = 9325
}

queues {
  pedidos360-eventos {
    defaultVisibilityTimeout = 10 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
}
